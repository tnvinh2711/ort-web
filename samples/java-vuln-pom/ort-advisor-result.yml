                  summary: "XML External Entity (XXE) vulnerability in jackson-databind"
                  description: >
                    A flaw was found in FasterXML jackson-databind prior to 2.9.10.8.
                    The default parsing of XML through XmlMapper does not properly parse
                    DOCTYPE declarations. An attacker can provide maliciously crafted
