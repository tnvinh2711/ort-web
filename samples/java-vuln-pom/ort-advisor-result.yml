                  description: >
                    In FasterXML jackson-databind before 2.13.4, resource exhaustion
                    can occur because of a lack of a check in
                    BeanDeserializer._deserializeFromArray to prevent use of deeply
                    nested arrays. An attacker can exploit this to exhaust memory and
                    cause a Denial of Service.
                  severity:
