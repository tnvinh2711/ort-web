                    - url: "https://nvd.nist.gov/vuln/detail/CVE-2022-42004"
                      type: "CVE"
                  summary: "DoS in BeanDeserializerFactory.constructBeanDeserializerFromBlackbird"
                  description: >
                    In FasterXML jackson-databind before 2.13.4, resource exhaustion
                    can occur because of a lack of a check in
                    BeanDeserializerFactory.constructBeanDeserializerFromBlackbird.
                    Crafted input can force the library into an O(n²) CPU loop,
