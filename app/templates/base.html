<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ t('app.title') }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script defer src="/static/js/app.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <a class="sidebar-brand" href="/?lang={{ lang }}">
        <svg class="sidebar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>ORT Web</span>
      </a>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="/?lang={{ lang }}"
           hx-get="/?lang={{ lang }}"
           hx-target="#page-content"
           hx-swap="innerHTML"
           hx-push-url="true"
           data-path="/"
           class="sidebar-link{% if request.url.path == '/' %} active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          {{ t('nav.dashboard') }}
        </a>
        <a href="/results/?lang={{ lang }}"
           hx-get="/results/?lang={{ lang }}"
           hx-target="#page-content"
           hx-swap="innerHTML"
           hx-push-url="true"
           data-path="/results/"
           class="sidebar-link{% if request.url.path.startswith('/results') %} active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          {{ t('nav.history') }}
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="lang-switch">
        <a href="{{ request.url.path }}?lang=vi" class="lang-btn{% if lang == 'vi' %} lang-active{% endif %}">VI</a>
        <a href="{{ request.url.path }}?lang=en" class="lang-btn{% if lang == 'en' %} lang-active{% endif %}">EN</a>
      </div>
    </div>
  </aside>

  <!-- Mobile header -->
  <header class="mobile-header">
    <button class="mobile-menu-btn" onclick="document.body.classList.toggle('sidebar-open')" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="mobile-brand" href="/?lang={{ lang }}">ORT Web</a>
    <div class="lang-switch">
      <a href="{{ request.url.path }}?lang=vi" class="lang-btn{% if lang == 'vi' %} lang-active{% endif %}">VI</a>
      <a href="{{ request.url.path }}?lang=en" class="lang-btn{% if lang == 'en' %} lang-active{% endif %}">EN</a>
    </div>
  </header>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

  <!-- Main content -->
  <main class="main-content">
    <div class="container" id="page-content">
      {% block content %}{% endblock %}
    </div>
  </main>

<script>
  // Update active sidebar link after HTMX navigation
  document.body.addEventListener('htmx:afterSettle', function() {
    var path = window.location.pathname;
    document.querySelectorAll('#sidebar-nav .sidebar-link').forEach(function(a) {
      var ap = a.getAttribute('data-path') || '';
      var isActive = ap === '/' ? path === '/' : path.startsWith(ap);
      a.classList.toggle('active', isActive);
    });
    // Restore job panel on dashboard navigation
    if (path === '/' && !document.getElementById('active-job-panel')) {
      var jobId = localStorage.getItem('ort_active_job');
      if (jobId && typeof loadJobPanel === 'function') loadJobPanel(jobId, false);
    }
  });
</script>
</body>
</html>
