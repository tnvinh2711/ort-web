{% extends 'base.html' %}
{% block content %}
<section class="hero">
  <h1>Supporting Commands</h1>
  <p>Operational and ecosystem commands around the ORT pipeline.</p>
</section>

<section class="cards-grid">
  {% for cmd in commands %}
  <article class="info-card">
    <h3>{{ cmd.id }}</h3>
    <p>{{ cmd.purpose }}</p>
    <p class="mono" style="font-size:12px; color:var(--muted);">{{ cmd.sample }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
