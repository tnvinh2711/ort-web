{% extends 'base.html' %}
{% block content %}
<section class="hero">
  <h1>{{ t('nav.history') }}</h1>
  <p>{{ t('dashboard.jobs_filter_placeholder') }}</p>
</section>

<section class="panel">
  <form id="jobs-filter-form" onsubmit="return false;">
    <!-- Row 1: Search -->
    <input id="jobs-filter-q" name="q" placeholder="{{ t('dashboard.jobs_filter_placeholder') }}" />

    <!-- Row 2: Dropdowns -->
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
      <select id="jobs-filter-status" name="status">
        <option value="all">{{ t('dashboard.jobs_filter_all') }}</option>
        <option value="pending">{{ t('status.pending') }}</option>
        <option value="running">{{ t('status.running') }}</option>
        <option value="success">{{ t('status.success') }}</option>
        <option value="failed">{{ t('status.failed') }}</option>
        <option value="cancelled">{{ t('status.cancelled') }}</option>
      </select>
      <select id="jobs-filter-language" name="detected_language">
        <option value="">{{ t('dashboard.filter_all_languages') }}</option>
        {% for opt in language_options %}
        <option value="{{ opt.value }}">{{ opt.label }}</option>
        {% endfor %}
      </select>
      <select id="jobs-filter-time" name="time_range">
        <option value="">{{ t('dashboard.time_all') }}</option>
        <option value="1">{{ t('dashboard.time_1d') }}</option>
        <option value="7">{{ t('dashboard.time_7d') }}</option>
        <option value="30">{{ t('dashboard.time_30d') }}</option>
        <option value="90">{{ t('dashboard.time_90d') }}</option>
        <option value="custom">{{ t('dashboard.time_custom') }}</option>
      </select>
    </div>

    <!-- Custom date range -->
    <div id="custom-date-range" style="display:none;">
      <div style="display:flex; gap:8px; align-items:center;">
        <label style="font-size:12px; color:var(--muted); white-space:nowrap;">{{ t('dashboard.date_from') }}</label>
        <input type="date" id="jobs-filter-date-from" name="date_from" style="flex:1;" />
        <label style="font-size:12px; color:var(--muted); white-space:nowrap;">{{ t('dashboard.date_to') }}</label>
        <input type="date" id="jobs-filter-date-to" name="date_to" style="flex:1;" />
      </div>
    </div>

    <input type="hidden" id="jobs-filter-page" name="page" value="1" />
  </form>

  <div
    id="jobs-container"
    hx-get="/partials/jobs?lang={{ lang }}"
    hx-include="#jobs-filter-form"
    hx-trigger="load, refresh-jobs, keyup changed delay:300ms from:#jobs-filter-q, change from:#jobs-filter-status, change from:#jobs-filter-language"
    hx-swap="innerHTML"
  ></div>

  <script>
    var timeSelect = document.getElementById('jobs-filter-time');
    var customRange = document.getElementById('custom-date-range');
    var dateFrom = document.getElementById('jobs-filter-date-from');
    var dateTo = document.getElementById('jobs-filter-date-to');

    timeSelect.addEventListener('change', function() {
      var val = timeSelect.value;
      if (val === 'custom') {
        customRange.style.display = '';
        return;
      }
      customRange.style.display = 'none';
      if (val !== '') {
        var d = new Date();
        d.setDate(d.getDate() - parseInt(val));
        dateFrom.value = d.toISOString().split('T')[0];
        dateTo.value = '';
      } else {
        dateFrom.value = '';
        dateTo.value = '';
      }
      document.getElementById('jobs-filter-page').value = '1';
      htmx.trigger(document.getElementById('jobs-container'), 'refresh-jobs');
    });

    dateFrom.addEventListener('change', function() {
      document.getElementById('jobs-filter-page').value = '1';
      htmx.trigger(document.getElementById('jobs-container'), 'refresh-jobs');
    });
    dateTo.addEventListener('change', function() {
      document.getElementById('jobs-filter-page').value = '1';
      htmx.trigger(document.getElementById('jobs-container'), 'refresh-jobs');
    });

    document.querySelectorAll('#jobs-filter-q, #jobs-filter-status, #jobs-filter-language').forEach(function(el) {
      el.addEventListener('change', function() { document.getElementById('jobs-filter-page').value = '1'; });
      el.addEventListener('keyup', function() { document.getElementById('jobs-filter-page').value = '1'; });
    });

    function goToPage(p) {
      document.getElementById('jobs-filter-page').value = p;
      htmx.trigger(document.getElementById('jobs-container'), 'refresh-jobs');
    }

    // After each jobs list swap, schedule next poll if any job is still running
    function scheduleJobsPoll() {
      var container = document.getElementById('jobs-container');
      if (!container) return;
      if (container.querySelector('[data-job-status="running"],[data-job-status="pending"]')) {
        setTimeout(function() {
          htmx.trigger(document.getElementById('jobs-container'), 'refresh-jobs');
        }, 5000);
      }
    }
    document.body.addEventListener('htmx:afterSettle', function(evt) {
      if (evt.target && evt.target.id === 'jobs-container') scheduleJobsPoll();
    });
  </script>
</section>
{% endblock %}
