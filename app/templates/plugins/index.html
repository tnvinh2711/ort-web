{% extends 'base.html' %}
{% block content %}
<section class="hero compact">
  <h1>Plugin Explorer</h1>
  <p>Browse plugin categories across ORT integrations.</p>
</section>

<section class="plugin-grid">
  {% for category, items in categories.items() %}
  <article class="info-card">
    <h3>{{ category }}</h3>
    <ul>
      {% for item in items %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </article>
  {% endfor %}
</section>
{% endblock %}
