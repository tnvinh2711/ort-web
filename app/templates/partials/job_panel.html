<article class="job-card status-{{ job.status.value }}">
  <header>
    <strong>{{ job.name }}</strong>
    <span id="job-status-badge-{{ job.job_id }}" class="status-pill status-pill-{{ job.status.value }}">{{ job.status.value }}</span>
  </header>
  <p class="mono" style="word-break:break-all; color:var(--secondary); margin:4px 0;">{{ job.command }}</p>
  <p class="mono" style="color:var(--muted); margin:0 0 8px; font-size:12px;">{{ job.created_at }}</p>
  {% if job.error_message %}
  <p style="color:var(--danger); font-size:13px; padding:8px 12px; background:var(--danger-light); border-radius:var(--radius); margin:0 0 8px;">{{ job.error_message }}</p>
  {% endif %}
  <pre id="job-log-{{ job.job_id }}" style="max-height:70vh; overflow:auto; white-space:pre-wrap;">{{ log_text }}</pre>
</article>

{% if job.status.value in ('pending', 'running') %}
<script>
(function() {
  var jobId = '{{ job.job_id }}';
  var logEl = document.getElementById('job-log-' + jobId);
  var badge = document.getElementById('job-status-badge-' + jobId);
  if (!logEl) return;

  // Auto-scroll to bottom on load
  logEl.scrollTop = logEl.scrollHeight;

  // Connect SSE for realtime log streaming
  var src = new EventSource('/jobs/' + jobId + '/events');

  src.addEventListener('log', function(e) {
    try {
      var data = JSON.parse(e.data);
      if (data.line) {
        logEl.textContent += data.line;
        // Auto-scroll if user is near bottom
        var nearBottom = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 100;
        if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
      }
    } catch (_) {}
  });

  src.addEventListener('status', function(e) {
    try {
      var data = JSON.parse(e.data);
      var status = data.status || '';
      if (badge) {
        badge.textContent = status;
        badge.className = 'status-pill status-pill-' + status;
      }
      // Job finished — close stream and reload panel for final state
      if (status === 'success' || status === 'failed' || status === 'cancelled') {
        src.close();
        // Reload the panel to get final error_message etc.
        setTimeout(function() {
          window.location.reload();
        }, 500);
      }
    } catch (_) {}
  });

  src.onerror = function() {
    src.close();
  };
})();
</script>
{% endif %}
